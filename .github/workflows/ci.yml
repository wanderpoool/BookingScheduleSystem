name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/BookingScheduleSystem.Api/BookingScheduleSystem.Api.csproj
          dotnet restore src/BookingScheduleSystem.Web/BookingScheduleSystem.Web.csproj

      - name: Build API
        run: dotnet build src/BookingScheduleSystem.Api/BookingScheduleSystem.Api.csproj --no-restore -c Release

      - name: Build Web
        run: dotnet build src/BookingScheduleSystem.Web/BookingScheduleSystem.Web.csproj --no-restore -c Release

      - name: Build API Docker image
        run: |
          docker build \
            -t bookmeapp-api:ci \
            -f src/BookingScheduleSystem.Api/Dockerfile \
            src/

      - name: Build Web Docker image
        run: |
          docker build \
            -t bookmeapp-web:ci \
            -f src/BookingScheduleSystem.Web/Dockerfile \
            src/
