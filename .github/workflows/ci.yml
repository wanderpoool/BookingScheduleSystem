name: CI — Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: dotnet build src/BookingScheduleSystem.Api/BookingScheduleSystem.Api.csproj -c Release

      - name: Build Docker image (verify only)
        run: |
          docker build \
            -t bookmeapp-api:ci \
            -f src/BookingScheduleSystem.Api/Dockerfile \
            src/

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: dotnet build src/BookingScheduleSystem.Web/BookingScheduleSystem.Web.csproj -c Release

      - name: Build Docker image (verify only)
        run: |
          docker build \
            -t bookmeapp-web:ci \
            -f src/BookingScheduleSystem.Web/Dockerfile \
            src/
