name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  ECS_CLUSTER: bookmeapp-production
  APP_NAME: bookmeapp
  AWS_REGION: ap-southeast-1

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: dotnet build src/BookingScheduleSystem.Api/BookingScheduleSystem.Api.csproj -c Release

      - name: Build Docker image
        run: |
          docker build \
            -t bookmeapp-api:ci \
            -f src/BookingScheduleSystem.Api/Dockerfile \
            src/

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: dotnet build src/BookingScheduleSystem.Web/BookingScheduleSystem.Web.csproj -c Release

      - name: Build Docker image
        run: |
          docker build \
            -t bookmeapp-web:ci \
            -f src/BookingScheduleSystem.Web/Dockerfile \
            src/

  deploy:
    name: Deploy to AWS
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    environment: Production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Delete failed stack if in ROLLBACK_COMPLETE
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${APP_NAME}-production" \
            --query 'Stacks[0].StackStatus' \
            --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Current stack status: $STACK_STATUS"
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "ROLLBACK_FAILED" ] || [ "$STACK_STATUS" = "CREATE_FAILED" ] || [ "$STACK_STATUS" = "DELETE_FAILED" ] || [ "$STACK_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Stack is in $STACK_STATUS state — deleting before re-creating..."
            aws cloudformation delete-stack --stack-name "${APP_NAME}-production" --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete --stack-name "${APP_NAME}-production" --region "$AWS_REGION"
            echo "Stack deleted successfully."
          fi

      - name: Clean up orphaned ALB listeners from failed rollbacks
        run: |
          # Get the ALB ARN from the existing stack
          ALB_ARN=$(aws cloudformation describe-stack-resources \
            --stack-name "${APP_NAME}-production" \
            --logical-resource-id ApplicationLoadBalancer \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")

          if [ -z "$ALB_ARN" ] || [ "$ALB_ARN" = "None" ]; then
            echo "No ALB found in stack, skipping listener cleanup."
            exit 0
          fi

          # Check if an HTTPS:443 listener physically exists on the ALB
          HTTPS_LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$ALB_ARN" \
            --query 'Listeners[?Port==`443`].ListenerArn' \
            --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")

          if [ -z "$HTTPS_LISTENER_ARN" ] || [ "$HTTPS_LISTENER_ARN" = "None" ]; then
            echo "No HTTPS listener on ALB, nothing to clean up."
            exit 0
          fi

          # Check if CloudFormation actually manages the HttpsListener
          CF_LISTENER=$(aws cloudformation describe-stack-resource \
            --stack-name "${APP_NAME}-production" \
            --logical-resource-id HttpsListener \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")

          if [ -z "$CF_LISTENER" ] || [ "$CF_LISTENER" = "None" ]; then
            echo "Found orphaned HTTPS listener not managed by CloudFormation: $HTTPS_LISTENER_ARN"
            echo "Deleting orphaned listener so CloudFormation can recreate it..."
            aws elbv2 delete-listener \
              --listener-arn "$HTTPS_LISTENER_ARN" \
              --region "$AWS_REGION"
            echo "Orphaned HTTPS listener deleted."
          else
            echo "HTTPS listener is managed by CloudFormation ($CF_LISTENER), no cleanup needed."
          fi

      - name: Deploy CloudFormation stack (creates ECR repos, RDS, ALB, ECS)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws cloudformation deploy \
            --template-file infra/main.yaml \
            --stack-name "${APP_NAME}-production" \
            --parameter-overrides \
              "Environment=production" \
              "AppName=${APP_NAME}" \
              "ApiImageUri=${ECR_REGISTRY}/${APP_NAME}-api:latest" \
              "WebImageUri=${ECR_REGISTRY}/${APP_NAME}-web:latest" \
              "GlobalAdminEmail=${{ secrets.GLOBAL_ADMIN_EMAIL }}" \
              "GlobalAdminPassword=${{ secrets.GLOBAL_ADMIN_PASSWORD }}" \
              "HostedZoneId=${{ secrets.HOSTED_ZONE_ID }}" \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Show CloudFormation failure events
        if: failure()
        run: |
          echo "=== CloudFormation Stack Events (failures) ==="
          aws cloudformation describe-stack-events \
            --stack-name "${APP_NAME}-production" \
            --region "$AWS_REGION" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`ROLLBACK_IN_PROGRESS`].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table 2>/dev/null || true

          echo ""
          echo "=== Last 20 Stack Events ==="
          aws cloudformation describe-stack-events \
            --stack-name "${APP_NAME}-production" \
            --region "$AWS_REGION" \
            --query 'StackEvents[:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table 2>/dev/null || true

      - name: Build, tag, and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/${APP_NAME}-api:latest" \
            -t "$ECR_REGISTRY/${APP_NAME}-api:${IMAGE_TAG}" \
            -f src/BookingScheduleSystem.Api/Dockerfile \
            src/

          docker push "$ECR_REGISTRY/${APP_NAME}-api:latest"
          docker push "$ECR_REGISTRY/${APP_NAME}-api:${IMAGE_TAG}"

      - name: Build, tag, and push Web image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/${APP_NAME}-web:latest" \
            -t "$ECR_REGISTRY/${APP_NAME}-web:${IMAGE_TAG}" \
            -f src/BookingScheduleSystem.Web/Dockerfile \
            src/

          docker push "$ECR_REGISTRY/${APP_NAME}-web:latest"
          docker push "$ECR_REGISTRY/${APP_NAME}-web:${IMAGE_TAG}"

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${APP_NAME}-api" \
            --force-new-deployment \
            --region "$AWS_REGION"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${APP_NAME}-web" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for ECS services to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${APP_NAME}-api" "${APP_NAME}-web" \
            --region "$AWS_REGION"

      - name: Deployment summary
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "${APP_NAME}-production" \
            --query 'Stacks[0].Outputs[?OutputKey==`AlbDnsName`].OutputValue' \
            --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "unknown")

          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Cluster** | \`${ECS_CLUSTER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **API Image** | \`${ECR_REGISTRY}/${APP_NAME}-api:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Web Image** | \`${ECR_REGISTRY}/${APP_NAME}-web:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **ALB URL** | \`${ALB_DNS}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Health Check** | \`${ALB_DNS}/api/health\` |" >> "$GITHUB_STEP_SUMMARY"
