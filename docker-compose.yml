services:
  postgres:
    image: postgres:16
    container_name: bookingschedule_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingschedule
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: BookingScheduleSystem.Api/Dockerfile
    container_name: bookingschedule_api
    ports:
      - "5059:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSQL: "Host=postgres;Database=bookingschedule;Username=postgres;Password=postgres"
      Cors__AllowedOrigins: "http://localhost:5288"
      Jwt__Issuer: "BookingScheduleSystem"
      Jwt__Audience: "BookingScheduleSystem"
      Jwt__SecretKey: "CHANGE_THIS_SECRET_KEY_IN_PRODUCTION_USE_SECURE_STORAGE"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src
      dockerfile: BookingScheduleSystem.Web/Dockerfile
    container_name: bookingschedule_web
    ports:
      - "5288:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiSettings__BaseUrl: "http://api:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
